        try {
            const response = await fetch('question.json');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            questionDB = data;
            totalQuestions = Object.keys(questionDB).length;
            questionDBLoaded = true;
            //console.log('✅ 题库加载成功，共 ' + totalQuestions + ' 道题');
			console.log('✅ 题库加载成功');
            return true;
        } catch (error) {
            console.error('❌ 加载题库失败:', error);
            document.getElementById('moduleGrid').innerHTML = `
                <div class="loading-text" style="color:#b91c1c;">
                    ❌ 题库加载失败，请确保 question.json 文件存在且格式正确。<br>
                    <span style="font-size:0.8rem;color:#64748b;">错误信息: ${error.message}</span>
                </div>
            `;
            return false;
        }
    }

    // ======================== 统计各模块题目数量 ========================
    function countModuleQuestions() {
        const stats = [];
        modules.forEach(mod => {
            let count = 0;
            const allQs = new Set();
            mod.rows.forEach(row => {
                row.qs.split(',').map(s => s.trim()).filter(s => s).forEach(q => {
                    if (questionDB[q]) {
                        if (!allQs.has(q)) {
                            allQs.add(q);
                            count++;
                        }
                    }
                });
            });
            stats.push({ name: mod.short, count: count });
        });
        return stats;
    }

    function renderStats() {
        const stats = countModuleQuestions();
        const total = stats.reduce((sum, s) => sum + s.count, 0);
        const bar = document.getElementById('statsBar');
        /**bar.innerHTML = `
            <span>📊 总题库: <span class="num">${totalQuestions}</span> 题</span>
            <span>📚 已分类: <span class="num">${total}</span> 题</span>
            ${stats.map(s => `<span>${s.name}: <span class="num">${s.count}</span></span>`).join('')}
        `;
		**/
    }

    // ======================== 登录/退出逻辑 ========================
    async function handleLogin() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const err = document.getElementById('loginError');
        
        if (user === VALID_USER && pass === VALID_PASS) {
            if (!questionDBLoaded) {
                const loaded = await loadQuestionDB();
                if (!loaded) {
                    err.textContent = '❌ 题库加载失败，请刷新后重试';
                    return;
                }
            }
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('appContainer').classList.add('active');
            err.textContent = '';
            renderCards();
            renderStats();
        } else {
            err.textContent = '❌ 用户名或密码错误，请重试';
        }
    }

    function handleLogout() {
        document.getElementById('loginPage').style.display = 'flex';
        document.getElementById('appContainer').classList.remove('active');
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('loginError').textContent = '';
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && document.getElementById('loginPage').style.display !== 'none') {
            handleLogin();
        }
    });

    // ======================== 渲染卡片 ========================
    function renderCards() {
        const container = document.getElementById('moduleGrid');
        container.innerHTML = '';
        modules.forEach(mod => {
            const card = document.createElement('div');
            card.className = 'card';
            let rowsHtml = '';
            mod.rows.forEach(row => {
                const qs = row.qs.split(',').map(s => s.trim()).filter(s => s);
                // 只显示在题库中存在的题号
                const validQs = qs.filter(q => questionDB[q]);
                if (validQs.length === 0) {
                    // 如果该行没有有效题目，显示占位
                    rowsHtml += `<div class="row"><span class="row-label">${row.label}</span><span style="color:#94a3b8;font-size:0.7rem;">（暂无题目）</span></div>`;
                    return;
                }
                const links = validQs.map(q => `<a class="q-link" href="#" data-q="${q}">${q}</a>`).join(' ');
                rowsHtml += `<div class="row"><span class="row-label">${row.label}</span><span class="q-links">${links}</span></div>`;
            });
            card.innerHTML = `
                <div class="module-title">${mod.name} <small>${mod.short}</small></div>
                ${rowsHtml}
            `;
            container.appendChild(card);
        });
    }

    // ======================== 模态框 ========================
    function openModal(qid) {
        const data = questionDB[qid];
        if (!data) {
            document.getElementById('modalMeta').textContent = `题号 ${qid} · 暂未收录`;
            document.getElementById('modalQuestion').textContent = '该题目暂未收录完整解析，请参考文档原文。';
            document.getElementById('modalOptions').innerHTML = '';
            document.getElementById('modalAnswer').innerHTML = '';
            document.getElementById('modalAnalysis').innerHTML = '';
            document.getElementById('modal').classList.add('active');
            return;
        }
        let modName = '未知模块';
        for (const m of modules) {
            for (const row of m.rows) {
                if (row.qs.split(',').map(s=>s.trim()).includes(qid)) {
                    modName = m.name;
                    break;
                }
            }
            if (modName !== '未知模块') break;
        }
        document.getElementById('modalMeta').textContent = `题号 ${qid} · ${modName}`;
        document.getElementById('modalQuestion').textContent = data.q || '题目内容缺失';
        document.getElementById('modalOptions').innerHTML = data.opts ? data.opts.replace(/\n/g, '<br>') : '';
        document.getElementById('modalAnswer').innerHTML = `<strong>✅ 答案：</strong>${data.ans || '未提供'}`;
        document.getElementById('modalAnalysis').innerHTML = `<strong>📖 解析：</strong>${data.analysis || '暂无解析'}`;
        document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('active');
    }

    document.addEventListener('click', function(e) {
        const link = e.target.closest('.q-link');
        if (link) {
            e.preventDefault();
            const qid = link.getAttribute('data-q');
            if (qid) openModal(qid);
        }
    });
    document.getElementById('modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });

    // 初始状态：显示登录页
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('appContainer').classList.remove('active');

    // 预加载题库
    loadQuestionDB();
</script>
