            margin-top: 2px;

        .option-label {
            font-size: 15.5px;
            color: #1a304a;
            word-break: break-word;
        }
        .answer-section {
            margin-top: 14px;
            padding-top: 12px;

            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 6px 20px;

            border-radius: 30px;
            padding: 3px 18px;
            font-size: 14px;
            font-weight: 500;
            color: #0b2a47;

            background: #c8e6d9;
            color: #0a4a2c;
        }
        .answer-badge.wrong {
            background: #f8d4d4;
            color: #8f2a2a;
        }

            margin-top: 10px;

            }

                flex-direction: column;
                align-items: stretch;
            }

            }

                padding: 32px 20px;
            }
            .login-container .wrong-badge {
                position: static;
                display: inline-flex;
                margin-bottom: 12px;
                justify-content: center;
            }
        }
    </style>
</head>

  {"id":23,"question":"在特征选择时，卡方检验常用于哪类数据（）。","options":["连续型数据","离散型数据","混合型数据","数值型数据"],"answer":1,"explanation":"卡方检验是用于检验类别变量之间的独立性的统计方法，常用于离散型数据。它通过比较观察频次与期望频次之间的差异来判断两个分类变量是否有显著关系。卡方检验不适用于连续型或数值型数据。"},

  {"id":28,"question":"留出法、交叉验证法和自助法在数据利用效率与评估稳定性方面，各自的主要优劣之处是（）。","options":["留出法：评估结果方差大，计算量大；交叉验证法：样本利用率高，评估结果方差小；自助法：样本利用率低，评估结果方差大。","留出法：评估结果方差小，计算量小；交叉验证法：样本利用率低，评估结果方差大；自助法：样本利用率高，评估结果方差小。","留出法：样本利用率高，评估结果方差大；交叉验证法：评估结果方差小，计算量大，评估结果方差小。","留出法：样本利用率低，评估结果方差大；交叉验证法：评估结果方差小，计算量大；自助法：样本利用率高，评估结果方差大。"],"answer":3,"explanation":"留出法样本利用率低、方差大；交叉验证法方差小、计算量大；自助法利用率高、方差大。"},

  {"id":35,"question":"问卷调查法是收集用户看法和反馈时常用的手段，其中（）类型的调查问卷更容易获取真实且深入的信息。","options":["开放式问卷","单选题问卷","多选题问卷","排序题问卷"],"answer":0,"explanation":"开放式问卷允许用户自由表达自己的意见，不受选项限制，因此更容易获得更全面、真实的反馈，能够深入了解用户的真实感受和需求。单选题问卷通过限制用户选择固定选项，虽然能便于数据的量化，但可能无法准确反映用户的真实想法和多样化需求，容易产生偏差。与单选题类似，多选题问卷虽然允许选择多个选项，但仍然是在预设的框架内，无法深入捕捉用户的真实反馈，尤其是当问题设计不够全面时。排序题问卷通过让用户对选项进行排序来获取优先级信息，但这种方法也存在一定局限性，因为它可能会简化用户的复杂思维过程，无法反映他们的全面意见。参考资料：《人机交互与界面设计》（李靖、韩金华编）P146。"},

  {"id":49,"question":"在体现 “选择” 关系的状态转换网络中，状态 S0 具有怎样的特点？（）","options":["S0 是一个孤立状态，没有任何转换关系","S0 只能通过内部事件触发状态转换","S0 是初始状态，可以通过外部事件0 和外部事件1 转换到其他状态","S0 是一个终止状态，不能转换到其他状态"],"answer":2,"explanation":"根据“选择”关系的状态转换网络，S0 是初始状态，可以通过外部事件0 转换到状态 S1，或者通过外部事件1 转换到状态 S2。此外，它也可以通过 G0 或 G1 的正常结束事件回到自身。"},
  {"id":50,"question":"在特征选择方法中，哪项通常依据特征与目标变量之间的相关性来进行特征选择（）。","options":["过滤式方法","包裹式方法","嵌入式方法","主成分分析"],"answer":0,"explanation":"过滤式方法（Filter Method）是通过评估各个特征与目标变量之间的相关性（如通过相关系数、卡方检验、信息增益等统计方法）来选择最相关的特征，通常独立于任何机器学习模型。因此，选项A是正确的。包裹式方法（Wrapper Method）通过使用特定的学习算法来评估特征子集的性能，选择对模型表现最有利的特征。嵌入式方法（Embedded Method）在训练模型的过程中同时进行特征选择，常见的如L1正则化（Lasso）和决策树等模型。主成分分析（PCA）是一种降维技术，而不是特征选择方法，虽然它也涉及特征的重要性评估，但其目的在于将数据投影到较低维度空间，而非直接选择特征。"},

  {"id":55,"question":"进行人机交互界面设计时，状态转移网络（STN）所存在的一个主要缺陷是（）。","options":["它的状态转换过程完全不依赖于事件驱动","它完全不适用于小型系统设计","它需要明确列出所有可能的系统状态，状态的数量会急剧增加","它能很好地描述并发行为和多任务交互"],"answer":2,"explanation":"D项错误：状态转换网络（STN）擅长描述串行和顺序行为，但对并发行为和多任务交互的描述能力较差。 C项正确：状态转换网络的一个主要问题是，它需要列出所有可能的系统状态。随着状态数量的增加，状态之间的转换数目会急剧增加，导致设计复杂性和管理难度的大幅上升。 B项错误：STN适用于小型系统的设计，特别是当系统状态数量较少时，但在大型系统中，状态数量的急剧增加会使得它变得难以维护。 A项错误：状态转换网络的设计往往依赖于事件驱动，状态间的转换通常是由用户操作或其他系统事件触发的。"},

  {"id":57,"question":"在以下哪些情况中，选择事件模式作为输入模式是最恰当的？（）","options":["输入数据是连续性的，且需要实时处理，如鼠标和键盘输入","输入数据需要在应用程序暂停时等待，直到收到数据后才继续执行","应用程序需要同时处理多个输入设备的输入，且保证输入数据不会丢失","输入频率较低且不需要实时响应，适合按需触发输入"],"answer":2,"explanation":"应用程序需要同时处理多个输入设备的输入，且保证输入数据不会丢失，事件模式最适合这种场景，因为它允许输入设备和应用程序并行工作，输入数据会被保存到事件队列中，应用程序可以随时读取，确保数据不会丢失。此选项符合事件模式的特点，因此是正确答案。其他选项解析：输入数据是连续性的，且需要实时处理，如鼠标和键盘输入，这种情况适合采样模式，因为采样模式支持连续性的信息流，并且应用程序可以在处理其他数据时不断采样输入设备数据。输入数据需要在应用程序暂停时等待，直到收到数据后才继续执行，这种情况适合请求模式，因为请求模式要求应用程序在等待输入时暂停执行，直到收到输入数据后才继续执行。输入频率较低且不需要实时响应，适合按需触发输入，这种情况适合请求模式，因为输入的频率较低，且不要求实时响应，适合在应用程序需要输入时才启动输入设备。"},

  {"id":74,"question":"在业务流程重组（BPR）中，最能体现 “整体服务的思路” 这一原则的是（）。","options":["专注于单一部门的流程优化","强调跨部门的流程整合","仅关注降低成本","忽略客户需求"],"answer":1,"explanation":"业务流程体系要体现整体服务的思路，即整合全公司的资源，以流程突破部门界限，全体员工共同努力改进客户服务（B项）。这意味着流程重组不是仅仅关注单个部门的优化，而是要实现跨部门的流程整合，确保整个组织能够协同工作，以提供更连贯、高效的服务。选项A专注于单一部门的流程优化不符合整体服务的思路，选项C仅关注降低成本忽略了服务质量，而选项D忽略客户需求则违背了流程重组始于客户需求的原则。"},

  {"id":76,"question":"（）的情况属于欠拟合。","options":["模型过于简单，不能很好地拟合数据","模型过于复杂，过拟合","数据量过大，无法拟合模型","数据异常，无法拟合模型"],"answer":0,"explanation":"欠拟合是指模型过于简单，无法有效地拟合数据，从而导致训练和测试误差都较高。选项B描述的是过拟合，指的是模型过于复杂，导致模型在训练数据上表现良好，但在测试数据上表现较差。选项C提到的是数据量过大，这与欠拟合无关，更多的是与计算资源和训练时间相关，而非模型的复杂度。选项D提到的是数据异常问题，虽然数据质量对模型性能有影响，但数据异常更多地会导致模型无法正常训练，而不一定与欠拟合直接相关。"},

  {"id":79,"question":"在业务流程重组（BPR）中，下列哪一项不是造成项目失败的主要原因（）。","options":["流程重组后缺乏对员工的奖励机制","组织对变革的抗拒","不切实际的实施范围与期望","缺乏高层管理人员的支持和参与"],"answer":0,"explanation":"高层管理人员的支持对于BPR的成功至关重要，他们的参与可以确保项目获得必要的资源和关注。如果项目的范围过于广泛或期望过高，可能导致项目难以实现预定目标。员工和管理层可能对变革持保守态度，这种抗拒会阻碍BPR的实施。"},

            const LABELS = ['A', 'B', 'C', 'D'];
            const STORAGE_KEY = 'wrongBookData';
            const USER_KEY = 'testUser';

            // DOM 引用
            const loginContainer = document.getElementById('loginContainer');
            const appContainer = document.getElementById('appContainer');
            const usernameInput = document.getElementById('usernameInput');
            const passwordInput = document.getElementById('passwordInput');
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');
            const logoutBtn = document.getElementById('logoutBtn');
            const currentUserDisplay = document.getElementById('currentUserDisplay');
            const loginWrongCount = document.getElementById('loginWrongCount');

            const container = document.getElementById('questionContainer');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const generateBtn = document.getElementById('generateBtn');
            const clearBtn = document.getElementById('clearBtn');
            const submitBtn = document.getElementById('submitBtn');
            const numInput = document.getElementById('numInput');
            const totalStatus = document.getElementById('totalStatus');
            const wrongBookContainer = document.getElementById('wrongBookContainer');
            const wrongList = document.getElementById('wrongList');
            const wrongCountLabel = document.getElementById('wrongCountLabel');
            const showWrongBookBtn = document.getElementById('showWrongBookBtn');
            const clearWrongBookBtn = document.getElementById('clearWrongBookBtn');

            let currentQuestions = [];
            let userAnswers = {};
            let wrongBook = [];
            let currentUser = null;

            // ---------- 登录逻辑 ----------
            function login() {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                if (username === 'user' && password === 'user_123456') {
                    currentUser = username;
                    localStorage.setItem(USER_KEY, username);
                    loginError.textContent = '';
                    loginContainer.style.display = 'none';
                    appContainer.style.display = 'block';
                    currentUserDisplay.textContent = username;
                    loadWrongBook();
                    generatePaper();
                } else {
                    loginError.textContent = '❌ 用户名或密码错误，请重试';
                }
            }

            function logout() {
                currentUser = null;
                localStorage.removeItem(USER_KEY);
                appContainer.style.display = 'none';
                loginContainer.style.display = 'block';
                usernameInput.value = '';
                passwordInput.value = '';
                loginError.textContent = '';
                wrongBookContainer.style.display = 'none';
                // 更新登录页错题数
                updateLoginWrongCount();
            }

            // ---------- 更新登录页错题数 ----------
            function updateLoginWrongCount() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (Array.isArray(parsed)) {
                            loginWrongCount.textContent = parsed.length;
                            return;
                        }
                    }
                } catch (e) {}
                loginWrongCount.textContent = '0';
            }

            // ---------- 错题本存储（使用 Set 去重） ----------
            function loadWrongBook() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    if (data) {
                        wrongBook = JSON.parse(data);
                        if (!Array.isArray(wrongBook)) wrongBook = [];
                    } else {
                        wrongBook = [];
                    }
                } catch (e) {
                    wrongBook = [];
                }
                // 按 id 去重（保留最新）
                const map = new Map();
                wrongBook.forEach(item => {
                    if (item && item.id !== undefined) {
                        map.set(item.id, item);
                    }
                });
                wrongBook = Array.from(map.values());
                saveWrongBook();
                updateWrongBookUI();
                updateLoginWrongCount();
            }

            function saveWrongBook() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(wrongBook));
                updateWrongBookUI();
                updateLoginWrongCount();
            }

            function updateWrongBookUI() {
                wrongCountLabel.textContent = `(${wrongBook.length} 题)`;
                if (wrongBook.length === 0) {
                    wrongList.innerHTML = `<div class="empty-wrong">✨ 暂无错题，继续加油！</div>`;
                } else {
                    let html = '';
                    const sorted = [...wrongBook].sort((a, b) => a.id - b.id);
                    sorted.forEach((item) => {
                        const userAnsLabel = (item.userAnswer !== undefined && item.userAnswer !== null) ?
                            LABELS[item.userAnswer] :
                            '未作答';
                        html += `
                            <div class="wrong-item">
                                <div class="q-text-sm">【第 ${item.id} 题】${item.question}</div>
                                <div class="meta">
                                    <span>你的答案：${userAnsLabel}</span>
                                    <span class="correct-ans">正确答案：${LABELS[item.answer]}</span>
                                    <span style="color:#7d4f2a;">解析：${item.explanation || '无'}</span>
                                </div>
                            </div>
                        `;
                    });
                    wrongList.innerHTML = html;
                }
            }

            function addWrongQuestion(q, userAns) {
                const exist = wrongBook.some(item => item.id === q.id);
                if (!exist) {
                    wrongBook.push({
                        id: q.id,
                        question: q.question,
                        options: q.options,
                        answer: q.answer,
                        explanation: q.explanation || '无解析',
                        userAnswer: userAns
                    });
                    saveWrongBook();
                } else {
                    const existing = wrongBook.find(item => item.id === q.id);
                    if (existing && existing.userAnswer !== userAns) {
                        existing.userAnswer = userAns;
                        saveWrongBook();
                    }
                }
            }

            function clearWrongBook() {
                if (wrongBook.length === 0) return;
                if (confirm('确定清空错题本吗？')) {
                    wrongBook = [];
                    saveWrongBook();
                    updateWrongBookUI();
                }
            }

            // ---------- 渲染试卷 ----------
            function renderQuestions(questions) {
                if (!questions || questions.length === 0) {
                    container.innerHTML =
                        `<div style="padding: 40px 20px; text-align: center; color: #6a7f9b;">请点击「生成试卷」开始测试</div>`;
                    return;
                }

                let html = '';
                questions.forEach((q, idx) => {
                    const optionsHtml = q.options.map((opt, optIdx) => {
                        const checked = (userAnswers[idx] === optIdx) ? 'checked' : '';
                        return `
                            <div class="option-row">
                                <input type="radio" name="q${idx}" value="${optIdx}" ${checked} data-qidx="${idx}" data-optidx="${optIdx}">
                                <span class="option-label">${LABELS[optIdx]}. ${opt}</span>
                            </div>
                        `;
                    }).join('');

                    html += `
                        <div class="q-item" id="qitem-${idx}">
                            <div class="q-header">
                                <span class="q-index">第 ${idx+1} 题</span>
                                <span class="q-text">${q.question}</span>
                            </div>
                            <div class="options">${optionsHtml}</div>
                            <div class="answer-section" id="answerSection-${idx}" style="display: none;">
                                <span class="answer-badge" id="resultBadge-${idx}"></span>
                                <span class="answer-badge" style="background:#e1ecf7;">正确答案：${LABELS[q.answer]}</span>
                                <div class="explanation"><span class="exp-label">📘 解析：</span>${q.explanation || '（无解析）'}</div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

                container.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.addEventListener('change', function(e) {
                        const qIdx = parseInt(this.dataset.qidx);
                        const optIdx = parseInt(this.dataset.optidx);
                        if (!isNaN(qIdx) && !isNaN(optIdx)) {
                            userAnswers[qIdx] = optIdx;
                        }
                    });
                });
            }

            // ---------- 随机抽取 ----------
            function pickRandomQuestions(n) {
                const total = FULL_QUESTIONS.length;
                const count = Math.min(n, total);
                const indices = Array.from({ length: total }, (_, i) => i);
                for (let i = indices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [indices[i], indices[j]] = [indices[j], indices[i]];
                }
                return indices.slice(0, count).map(idx => FULL_QUESTIONS[idx]);
            }

            // ---------- 重置状态 ----------
            function resetState() {
                userAnswers = {};
                document.querySelectorAll('.q-item').forEach(el => {
                    el.classList.remove('correct-highlight', 'wrong-highlight');
                });
                document.querySelectorAll('.answer-section').forEach(el => {
                    el.style.display = 'none';
                });
                scoreDisplay.textContent = '0 分';
                container.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.disabled = false;
                });
            }

            // ---------- 生成试卷 ----------
            function generatePaper() {
                let num = parseInt(numInput.value);
                if (isNaN(num) || num < 1) num = 1;
                if (num > FULL_QUESTIONS.length) num = FULL_QUESTIONS.length;
                numInput.value = num;

                currentQuestions = pickRandomQuestions(num);
                userAnswers = {};
                renderQuestions(currentQuestions);
                scoreDisplay.textContent = '0 分';
                document.querySelectorAll('.q-item').forEach(el => {
                    el.classList.remove('correct-highlight', 'wrong-highlight');
                });
                document.querySelectorAll('.answer-section').forEach(el => {
                    el.style.display = 'none';
                });
                container.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.disabled = false;
                });
                totalStatus.textContent = `题库 ${FULL_QUESTIONS.length} 题 · 当前 ${currentQuestions.length} 题`;
            }

            // ---------- 交卷评分 ----------
            function submitPaper() {
                if (currentQuestions.length === 0) {
                    alert('请先生成试卷！');
                    return;
                }

                const total = currentQuestions.length;
                let answeredCount = 0;
                for (let i = 0; i < total; i++) {
                    if (userAnswers[i] !== undefined && userAnswers[i] !== null) answeredCount++;
                }

                if (answeredCount < total) {
                    const confirmSubmit = confirm(`您还有 ${total - answeredCount} 道题未作答，确定交卷吗？`);
                    if (!confirmSubmit) return;
                }

                let correctCount = 0;
                container.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.disabled = true;
                });

                currentQuestions.forEach((q, idx) => {
                    const userAns = userAnswers[idx];
                    const correctAns = q.answer;
                    const isCorrect = (userAns === correctAns);

                    if (isCorrect) {
                        correctCount++;
                    } else {
                        const ansToStore = (userAns !== undefined && userAns !== null) ? userAns : null;
                        addWrongQuestion(q, ansToStore);
                    }

                    const qItem = document.getElementById(`qitem-${idx}`);
                    if (qItem) {
                        qItem.classList.remove('correct-highlight', 'wrong-highlight');
                        if (isCorrect) qItem.classList.add('correct-highlight');
                        else qItem.classList.add('wrong-highlight');
                    }

                    const answerSection = document.getElementById(`answerSection-${idx}`);
                    if (answerSection) {
                        answerSection.style.display = 'block';
                        const badge = document.getElementById(`resultBadge-${idx}`);
                        if (badge) {
                            if (isCorrect) {
                                badge.textContent = '✅ 正确';
                                badge.className = 'answer-badge correct';
                            } else {
                                const userLabel = (userAns !== undefined && userAns !== null) ? LABELS[userAns] : '未选';
                                badge.textContent = `❌ 错误 (你的选择: ${userLabel})`;
                                badge.className = 'answer-badge wrong';
                            }
                        }
                    }
                });

                scoreDisplay.textContent = `${correctCount} / ${total}`;
                updateWrongBookUI();
            }

            // ---------- 清空作答 ----------
            function clearAnswers() {
                if (currentQuestions.length === 0) {
                    alert('没有可清空的试卷，请先生成。');
                    return;
                }
                userAnswers = {};
                container.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.checked = false;
                    radio.disabled = false;
                });
                document.querySelectorAll('.q-item').forEach(el => {
                    el.classList.remove('correct-highlight', 'wrong-highlight');
                });
                document.querySelectorAll('.answer-section').forEach(el => {
                    el.style.display = 'none';
                });
                scoreDisplay.textContent = '0 分';
            }

            // ---------- 显示/隐藏错题本 ----------
            function toggleWrongBook() {
                if (wrongBookContainer.style.display === 'none') {
                    wrongBookContainer.style.display = 'block';
                    updateWrongBookUI();
                } else {
                    wrongBookContainer.style.display = 'none';
                }
            }

            // ---------- 事件绑定 ----------
            loginBtn.addEventListener('click', login);
            usernameInput.addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
            passwordInput.addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
            logoutBtn.addEventListener('click', logout);

            generateBtn.addEventListener('click', generatePaper);
            submitBtn.addEventListener('click', submitPaper);
            clearBtn.addEventListener('click', clearAnswers);
            showWrongBookBtn.addEventListener('click', toggleWrongBook);
            clearWrongBookBtn.addEventListener('click', clearWrongBook);

            numInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') generateBtn.click();
            });

            // ---------- 启动 ----------
            window.addEventListener('load', function() {
                updateLoginWrongCount();
                const savedUser = localStorage.getItem(USER_KEY);
                if (savedUser === 'user') {
                    currentUser = savedUser;
                    loginContainer.style.display = 'none';
                    appContainer.style.display = 'block';
                    currentUserDisplay.textContent = savedUser;
                    loadWrongBook();
                    generatePaper();
                } else {
                    loginContainer.style.display = 'block';
                    appContainer.style.display = 'none';
                    usernameInput.value = '';
                    passwordInput.value = '';
                }
            });
        })();
    </script>
</body>
</html>
