<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟考试系统</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f0f4f9;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 20, 50, 0.12);
            padding: 24px 28px 32px;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 8px 0;
        }
        .subhead {
            color: #4a6378;
            margin-bottom: 24px;
            border-bottom: 1px solid #e6edf4;
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .login-box {
            background: #f0f5fe;
            padding: 24px 28px;
            border-radius: 24px;
            margin: 20px 0 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 16px;
        }
        .login-box label {
            font-weight: 500;
            color: #1b3a5c;
            margin-right: 4px;
        }
        .login-box input {
            padding: 10px 16px;
            border: 1px solid #cbdae8;
            border-radius: 40px;
            font-size: 15px;
            background: white;
            min-width: 180px;
        }
        .login-box button {
            background: #1a5c9e;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            font-size: 15px;
        }
        .login-box button:hover {
            background: #0e4177;
        }
        .btn {
            background: #eef3f9;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            color: #1a3d5e;
            cursor: pointer;
            transition: 0.1s;
            font-size: 14px;
        }
        .btn-primary {
            background: #1a5c9e;
            color: white;
        }
        .btn-primary:hover {
            background: #134680;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #b7ccdf;
        }
        .btn-outline:hover {
            background: #e6eff7;
        }
        .btn-danger {
            background: #b13e3e;
            color: white;
        }
        .btn-danger:hover {
            background: #8f2e2e;
        }
        .btn-success {
            background: #1e8a4b;
            color: white;
        }
        .btn-success:hover {
            background: #15703d;
        }
        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 18px 0 20px;
        }
        .stats {
            background: #eaf1fa;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            color: #1d4a74;
        }
        .question-card {
            background: #fafcff;
            border: 1px solid #dfe8f2;
            border-radius: 24px;
            padding: 20px 24px;
            margin-bottom: 18px;
            transition: 0.1s;
        }
        .question-card.correct {
            border-left: 8px solid #1e8a4b;
            background: #f2fbf5;
        }
        .question-card.wrong {
            border-left: 8px solid #b13e3e;
            background: #fdf3f3;
        }
        .q-title {
            font-weight: 600;
            font-size: 16px;
            color: #0b2b4a;
            margin-bottom: 10px;
        }
        .q-title .badge {
            background: #dce6f0;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            margin-right: 10px;
        }
        .opts {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 8px 0 10px;
        }
        .opt-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            border-radius: 40px;
            background: white;
            border: 1px solid #dee9f3;
        }
        .opt-item input[type="radio"],
        .opt-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1a5c9e;
            cursor: pointer;
        }
        .opt-item label {
            flex: 1;
            font-size: 15px;
            color: #1c3d5e;
            cursor: pointer;
        }
        .answer-area {
            margin-top: 14px;
            padding: 12px 16px;
            background: #f0f6fe;
            border-radius: 18px;
            font-size: 14px;
            border-left: 4px solid #2a6eb0;
        }
        .answer-area strong {
            color: #003d7a;
        }
        .wrong-book {
            background: #fef7f0;
            border: 1px solid #f0dcc8;
            border-radius: 24px;
            padding: 16px 22px;
            margin: 20px 0;
        }
        .wrong-book .item {
            border-bottom: 1px dashed #e2d4c4;
            padding: 10px 0;
        }
        .flex {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .mt-2 {
            margin-top: 16px;
        }
        .hidden {
            display: none;
        }
        .score-big {
            font-size: 48px;
            font-weight: 700;
            color: #1a5c9e;
        }
        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #0b2b4a;
            padding: 12px 0 8px 0;
            border-bottom: 2px solid #dce6f0;
            margin: 20px 0 16px 0;
        }
        .section-title .count {
            font-size: 14px;
            font-weight: 400;
            color: #4a6378;
            margin-left: 10px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #4a6378;
            font-size: 18px;
        }
        .stats-bar {
            background: #f0f5fe;
            border-radius: 16px;
            padding: 12px 20px;
            margin: 10px 0 16px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 14px;
            color: #1a3d5e;
        }
        .stats-bar .item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stats-bar .num {
            font-weight: 700;
            font-size: 16px;
            color: #0b2b4a;
        }
        .tag-single {
            background: #d4e2f7;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .tag-multi {
            background: #f7d4e2;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .tag-judge {
            background: #d4f7e2;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        @media (max-width: 700px) {
            .app {
                padding: 16px;
            }
            .login-box input {
                min-width: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <div class="flex" style="justify-content: space-between;">
            <h1>📘 模拟考试系统</h1>
            <div>
                <button class="btn btn-outline" id="showWrongBtn" style="display:none;">📕 错题本 (<span id="wrongCount">0</span>)</button>
                <button class="btn btn-outline" id="logoutBtn" style="display:none;">🚪 退出</button>
            </div>
        </div>
        <div class="subhead">
            <span id="statusMsg">⏳ 正在加载题库...</span>
            <span id="userStatus" style="color:#5b7f9a;">未登录</span>
        </div>

        <!-- 登录区域 -->
        <div id="loginArea">
            <div class="login-box">
                <div><label>👤 用户名</label><input type="text" id="username" value="" placeholder=""></div>
                <div><label>🔒 密码</label><input type="password" id="password" value="" placeholder=""></div>
                <button id="loginBtn">登录 并开始考试</button>
            </div>
            <p style="color:#6d8aa8; font-size:14px; margin:0 0 12px 6px;"></p>
        </div>

        <!-- 考试主面板 -->
        <div id="examArea" class="hidden">
            <div class="exam-header">
                <div><span class="stats" id="statsLabel">📋 加载中...</span></div>
                <div class="flex">
                    <button class="btn btn-success" id="submitExamBtn">✅ 提交试卷</button>
                    <button class="btn btn-outline" id="resetExamBtn">🔄 重新组卷</button>
                </div>
            </div>

            <!-- 题库统计 -->
            <div id="statsBar" class="stats-bar hidden">
                <span class="item">📚 题库总览：</span>
                <span class="item"><span class="tag-single">单选</span> <span class="num" id="totalSingle">0</span> 题</span>
                <span class="item"><span class="tag-multi">多选</span> <span class="num" id="totalMulti">0</span> 题</span>
                <span class="item"><span class="tag-judge">判断</span> <span class="num" id="totalJudge">0</span> 题</span>
                <span class="item">📌 合计：<span class="num" id="totalAll">0</span> 题</span>
            </div>

            <div id="questionList"></div>
            <div class="mt-2 flex" style="justify-content: space-between;">
                <span id="progressInfo" style="color:#3e668a;">已选 0 / 100 题</span>
                <div><button class="btn btn-success" id="submitExamBtn2">✅ 提交试卷</button></div>
            </div>
        </div>

        <!-- 成绩 & 解析 -->
        <div id="resultArea" class="hidden" style="background:#eef4fa; border-radius: 28px; padding: 24px; margin: 20px 0;">
            <div class="flex" style="justify-content: space-between; align-items: center;">
                <span style="font-size:22px; font-weight:600;">📊 成绩</span>
                <span class="score-big" id="scoreDisplay">0</span>
            </div>
            <div style="display: flex; gap: 20px; flex-wrap: wrap; margin: 10px 0 6px;">
                <span>✅ 正确: <strong id="correctCount">0</strong></span>
                <span>❌ 错误: <strong id="wrongCountResult">0</strong></span>
                <span>📝 得分率: <strong id="rateDisplay">0%</strong></span>
            </div>
            <button class="btn btn-outline" id="showWrongFromResultBtn">📕 查看错题本</button>
            <button class="btn btn-outline" id="backToExamBtn">🔙 返回试卷</button>
        </div>

        <!-- 错题本 -->
        <div id="wrongBookArea" class="hidden wrong-book">
            <div class="flex" style="justify-content: space-between;">
                <h3 style="margin:0;">📕 错题本 (记忆错题)</h3>
                <button class="btn btn-danger" id="clearWrongBtn">清空错题</button>
            </div>
            <div id="wrongList" style="max-height:500px; overflow-y:auto;"></div>
            <p style="color:#7a6a5a; margin-top:12px;" id="wrongEmptyMsg">暂无错题，继续保持！</p>
        </div>
    </div>

    <script>
        // ========== 固定用户 ==========
        const VALID_USER = 'user';
        const VALID_PASS = 'user_123456';

        // ========== 全局状态 ==========
        let fullQuestions = null;
        let examQuestions = [];
        let isLoggedIn = false;
        let isSubmitted = false;
        let wrongBook = [];
        let currentWrongIds = new Set();
        let isLoading = true;

        // 题库统计
        let stats = { single: 0, multi: 0, judge: 0 };

        // DOM 引用
        const loginArea = document.getElementById('loginArea');
        const examArea = document.getElementById('examArea');
        const resultArea = document.getElementById('resultArea');
        const wrongBookArea = document.getElementById('wrongBookArea');
        const questionList = document.getElementById('questionList');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const correctCount = document.getElementById('correctCount');
        const wrongCountResult = document.getElementById('wrongCountResult');
        const rateDisplay = document.getElementById('rateDisplay');
        const progressInfo = document.getElementById('progressInfo');
        const userStatus = document.getElementById('userStatus');
        const statusMsg = document.getElementById('statusMsg');
        const statsLabel = document.getElementById('statsLabel');
        const statsBar = document.getElementById('statsBar');
        const totalSingle = document.getElementById('totalSingle');
        const totalMulti = document.getElementById('totalMulti');
        const totalJudge = document.getElementById('totalJudge');
        const totalAll = document.getElementById('totalAll');
        const wrongCountSpan = document.getElementById('wrongCount');
        const wrongList = document.getElementById('wrongList');
        const wrongEmptyMsg = document.getElementById('wrongEmptyMsg');
        const showWrongBtn = document.getElementById('showWrongBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        // ========== 辅助函数 ==========
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 判断题目类型 - 优化版
        function getQuestionType(item) {
            const ans = (item.ans || '').trim();
            const opts = item.opts || '';
            const qText = item.q || '';

            // 解析选项
            const optLines = opts.split('\n').filter(s => s.trim() !== '');
            const optTexts = optLines.map(s => s.replace(/^[A-D][.、]\s*/, '').trim());

            // ===== 第一步：判断题 =====

            // 1. ans 是 "正确" 或 "错误"
            if (ans === '正确' || ans === '错误') {
                return 'judge';
            }

            // 2. 选项包含"正确"和"错误"，且只有两个选项
            const hasZhengque = optTexts.some(t => t === '正确');
            const hasCuowu = optTexts.some(t => t === '错误');
            if (hasZhengque && hasCuowu && optLines.length === 2) {
                return 'judge';
            }

            // 3. 选项A和B分别是"正确"和"错误"
            if (optLines.length === 2) {
                const optA = optLines[0].replace(/^A[.、]\s*/, '').trim();
                const optB = optLines[1].replace(/^B[.、]\s*/, '').trim();
                if ((optA === '正确' && optB === '错误') || (optA === '错误' && optB === '正确')) {
                    return 'judge';
                }
            }

            // 4. 题干包含"判断"或"说法是否正确"等关键词
            const judgeKeywords = ['判断', '说法', '是否正确', '对还是错', '以下说法', '正确的是', '错误是'];
            if (judgeKeywords.some(kw => qText.includes(kw)) && optLines.length === 2) {
                // 进一步检查选项是否像判断题
                const isJudgeLike = optTexts.some(t => t === '正确' || t === '错误' || t.includes('正确') || t.includes(
                    '错误'));
                if (isJudgeLike) {
                    return 'judge';
                }
            }

            // ===== 第二步：多选题 =====

            // 5. ans 包含逗号
            if (ans.includes(',')) {
                return 'multi';
            }

            // 6. ans 长度 > 1 且包含 A-D 字母组合
            if (ans.length > 1) {
                const letters = ans.split('');
                const allValid = letters.every(ch => /^[A-D]$/.test(ch));
                if (allValid && ans.length > 1) {
                    return 'multi';
                }
            }

            // 7. 题干包含多选关键词
            const multiKeywords = ['多选', '多项', '哪些', '以下属于', '包括', '包含', '下列选项', '组合'];
            if (multiKeywords.some(kw => qText.includes(kw))) {
                // 检查答案是否可能有多个
                if (ans.length > 1 || ans.includes(',')) {
                    return 'multi';
                }
                // 如果答案只有一个字母，但题干明确说"多选"，也认为是多选
                if (qText.includes('多选') || qText.includes('多项')) {
                    return 'multi';
                }
            }

            // 8. 选项数量 >= 4 且答案字母组合
            if (optLines.length >= 4) {
                if (ans.length > 1 && /^[A-D]+$/.test(ans)) {
                    return 'multi';
                }
                // 检查选项文本是否包含"多选"提示
                if (qText.includes('多选') || qText.includes('多项')) {
                    return 'multi';
                }
            }

            // ===== 默认：单选题 =====
            return 'single';
        }

        // 获取正确答案的字母列表
        function getCorrectLetters(ans) {
            if (!ans) return [];
            if (ans.includes(',')) {
                return ans.split(',').map(s => s.trim()).filter(s => s.length > 0);
            }
            if (ans.length > 1 && /^[A-D]+$/.test(ans)) {
                return ans.split('');
            }
            return [ans.trim()];
        }

        // 统计题库
        function countQuestions(raw) {
            let s = 0,
                m = 0,
                j = 0;
            const ids = Object.keys(raw);
            for (let id of ids) {
                const item = raw[id];
                if (!item || !item.q) continue;
                const type = getQuestionType(item);
                if (type === 'judge') j++;
                else if (type === 'multi') m++;
                else s++;
            }
            return { single: s, multi: m, judge: j };
        }

        // 从原始题库抽取
        function extractQuestions(raw) {
            const singles = [];
            const judges = [];
            const multiples = [];

            const ids = Object.keys(raw);
            for (let id of ids) {
                const item = raw[id];
                if (!item || !item.q) continue;
                const type = getQuestionType(item);
                const newItem = { ...item, id, type };
                if (type === 'judge') {
                    judges.push(newItem);
                } else if (type === 'multi') {
                    multiples.push(newItem);
                } else {
                    singles.push(newItem);
                }
            }

            // 更新统计
            stats = { single: singles.length, multi: multiples.length, judge: judges.length };
            updateStatsUI();

            // 随机抽取
            const pick = (arr, n) => shuffleArray([...arr]).slice(0, Math.min(n, arr.length));

            const selectedSingles = pick(singles, 70);
            const selectedMultiples = pick(multiples, 20);
            const selectedJudges = pick(judges, 10);

            // 按顺序组合：先单选，再多选，最后判断
            let combined = [...selectedSingles, ...selectedMultiples, ...selectedJudges];

            // 更新统计显示
            statsLabel.textContent =
                `📋 单选题 ${selectedSingles.length} · 多选题 ${selectedMultiples.length} · 判断题 ${selectedJudges.length}`;

            let globalIndex = 0;
            return combined.map((q) => {
                const optsArr = q.opts ? q.opts.split('\n').filter(s => s.trim() !== '') : [];
                let correctLetters = null;
                if (q.type === 'multi') {
                    correctLetters = getCorrectLetters(q.ans);
                }
                const result = {
                    ...q,
                    index: globalIndex,
                    userAnswer: q.type === 'multi' ? [] : null,
                    optsArray: optsArr,
                    isCorrect: null,
                    correctLetters: correctLetters,
                };
                globalIndex++;
                return result;
            });
        }

        // 更新统计UI
        function updateStatsUI() {
            totalSingle.textContent = stats.single;
            totalMulti.textContent = stats.multi;
            totalJudge.textContent = stats.judge;
            totalAll.textContent = stats.single + stats.multi + stats.judge;
            statsBar.classList.remove('hidden');
        }

        // 渲染试卷
        function renderExam() {
            if (!examQuestions.length) {
                questionList.innerHTML = '<div class="loading">暂无题目，请重新组卷</div>';
                return;
            }

            const singleList = examQuestions.filter(q => q.type === 'single');
            const multiList = examQuestions.filter(q => q.type === 'multi');
            const judgeList = examQuestions.filter(q => q.type === 'judge');

            let html = '';

            const renderSection = (questions, title) => {
                if (!questions.length) return '';
                let sectionHtml =
                    `<div class="section-title">${title} <span class="count">共 ${questions.length} 题</span></div>`;
                questions.forEach((q) => {
                    const qNum = q.index + 1;
                    const typeLabel = q.type === 'single' ? '单选' : (q.type === 'judge' ? '判断' : '多选');
                    const isSubmittedClass = (q.isCorrect !== null) ? (q.isCorrect ? 'correct' : 'wrong') : '';

                    let optsHtml = '';
                    const opts = q.optsArray || [];

                    if (q.type === 'judge') {
                        let judgeOpts = ['正确', '错误'];
                        if (opts.length === 2) {
                            const opt1 = opts[0].replace(/^[A-D][.、]\s*/, '').trim();
                            const opt2 = opts[1].replace(/^[A-D][.、]\s*/, '').trim();
                            if ((opt1 === '正确' || opt1 === '错误') && (opt2 === '正确' || opt2 === '错误')) {
                                judgeOpts = [opt1, opt2];
                            }
                        }
                        optsHtml = judgeOpts.map(opt => {
                            const checked = (q.userAnswer === opt) ? 'checked' : '';
                            const disabled = isSubmitted ? 'disabled' : '';
                            return `<div class="opt-item"><input type="radio" name="q${q.index}" value="${opt}" ${checked} ${disabled}><label>${opt}</label></div>`;
                        }).join('');
                    } else if (q.type === 'multi') {
                        optsHtml = opts.map(opt => {
                            const val = opt.trim().substring(0, 1);
                            const checked = (Array.isArray(q.userAnswer) && q.userAnswer.includes(val)) ?
                                'checked' : '';
                            const disabled = isSubmitted ? 'disabled' : '';
                            return `<div class="opt-item"><input type="checkbox" name="q${q.index}" value="${val}" ${checked} ${disabled}><label>${opt}</label></div>`;
                        }).join('');
                    } else {
                        optsHtml = opts.map(opt => {
                            const val = opt.trim().substring(0, 1);
                            const checked = (q.userAnswer === val) ? 'checked' : '';
                            const disabled = isSubmitted ? 'disabled' : '';
                            return `<div class="opt-item"><input type="radio" name="q${q.index}" value="${val}" ${checked} ${disabled}><label>${opt}</label></div>`;
                        }).join('');
                    }

                    let answerHtml = '';
                    if (isSubmitted && q.isCorrect !== null) {
                        const correctAns = q.ans || '';
                        const userAns = Array.isArray(q.userAnswer) ? q.userAnswer.join(',') : (q.userAnswer ||
                            '未作答');
                        const statusText = q.isCorrect ? '✅ 正确' : '❌ 错误';
                        answerHtml =
                            `<div class="answer-area"><strong>${statusText}</strong> · 正确答案: ${correctAns}  · 你的答案: ${userAns}<br><span style="color:#0055aa;">解析: ${q.analysis || '无'}</span></div>`;
                    } else if (isSubmitted) {
                        const correctAns = q.ans || '';
                        answerHtml =
                            `<div class="answer-area"><strong>⚠️ 未作答</strong> · 正确答案: ${correctAns}<br><span style="color:#0055aa;">解析: ${q.analysis || '无'}</span></div>`;
                    }

                    sectionHtml += `<div class="question-card ${isSubmittedClass}">
                        <div class="q-title"><span class="badge">${qNum}. ${typeLabel}</span> ${q.q}</div>
                        <div class="opts">${optsHtml}</div>
                        ${answerHtml}
                    </div>`;
                });
                return sectionHtml;
            };

            html += renderSection(singleList, '一、单选题');
            html += renderSection(multiList, '二、多选题');
            html += renderSection(judgeList, '三、判断题');

            questionList.innerHTML = html;

            if (!isSubmitted) {
                document.querySelectorAll('input[type="radio"]').forEach(el => {
                    el.addEventListener('change', function(e) {
                        const name = this.name;
                        const idx = parseInt(name.substring(1));
                        if (isNaN(idx)) return;
                        const q = examQuestions[idx];
                        if (!q) return;
                        q.userAnswer = this.value;
                        updateProgress();
                    });
                });
                document.querySelectorAll('input[type="checkbox"]').forEach(el => {
                    el.addEventListener('change', function(e) {
                        const name = this.name;
                        const idx = parseInt(name.substring(1));
                        if (isNaN(idx)) return;
                        const q = examQuestions[idx];
                        if (!q || q.type !== 'multi') return;
                        if (!Array.isArray(q.userAnswer)) q.userAnswer = [];
                        const val = this.value;
                        if (this.checked) {
                            if (!q.userAnswer.includes(val)) q.userAnswer.push(val);
                        } else {
                            q.userAnswer = q.userAnswer.filter(v => v !== val);
                        }
                        updateProgress();
                    });
                });
            }
            updateProgress();
        }

        function updateProgress() {
            let answered = 0;
            examQuestions.forEach(q => {
                if (q.type === 'multi') {
                    if (Array.isArray(q.userAnswer) && q.userAnswer.length > 0) answered++;
                } else {
                    if (q.userAnswer && q.userAnswer.length > 0) answered++;
                }
            });
            progressInfo.textContent = `已选 ${answered} / ${examQuestions.length} 题`;
        }

        // ========== 提交 & 评分 ==========
        function submitExam() {
            if (isSubmitted) return;
            const total = examQuestions.length;
            let unanswered = 0;
            examQuestions.forEach(q => {
                if (q.type === 'multi') {
                    if (!Array.isArray(q.userAnswer) || q.userAnswer.length === 0) unanswered++;
                } else {
                    if (!q.userAnswer || q.userAnswer.length === 0) unanswered++;
                }
            });
            if (unanswered > 0) {
                if (!confirm(`还有 ${unanswered} 道题未作答，确定提交吗？`)) return;
            }

            let correct = 0;
            examQuestions.forEach(q => {
                let userAns = q.userAnswer;
                let isCorrect = false;

                if (q.type === 'multi') {
                    if (Array.isArray(userAns) && userAns.length > 0) {
                        const sortedUser = [...userAns].sort().join(',');
                        const sortedCorrect = (q.correctLetters || []).sort().join(',');
                        isCorrect = (sortedUser === sortedCorrect);
                    }
                } else {
                    isCorrect = (userAns === q.ans);
                }

                q.isCorrect = isCorrect;
                if (isCorrect) correct++;
                else {
                    if (!currentWrongIds.has(q.id)) {
                        currentWrongIds.add(q.id);
                        wrongBook.push({
                            ...q,
                            userAnswer: q.userAnswer,
                        });
                    }
                }
            });

            updateWrongBookUI();
            isSubmitted = true;
            const wrongs = total - correct;
            scoreDisplay.textContent = correct;
            correctCount.textContent = correct;
            wrongCountResult.textContent = wrongs;
            rateDisplay.textContent = Math.round((correct / total) * 100) + '%';
            resultArea.classList.remove('hidden');
            renderExam();
            document.getElementById('submitExamBtn').style.display = 'none';
            document.getElementById('submitExamBtn2').style.display = 'none';
            showWrongBtn.style.display = 'inline-block';
        }

        // ========== 错题本 ==========
        function updateWrongBookUI() {
            const count = wrongBook.length;
            wrongCountSpan.textContent = count;
            if (count === 0) {
                wrongList.innerHTML = '';
                wrongEmptyMsg.style.display = 'block';
            } else {
                wrongEmptyMsg.style.display = 'none';
                let html = '';
                wrongBook.forEach((q, idx) => {
                    const userAns = Array.isArray(q.userAnswer) ? q.userAnswer.join(',') : (q.userAnswer ||
                        '未作答');
                    html +=
                        `<div class="item"><strong>${idx+1}.</strong> ${q.q} <br> <span style="color:#b13e3e;">你的答案: ${userAns}</span> · 正确: ${q.ans} <br> <span style="color:#0066aa;">解析: ${q.analysis || '无'}</span></div>`;
                });
                wrongList.innerHTML = html;
            }
        }

        function showWrongBook() {
            wrongBookArea.classList.toggle('hidden');
            if (!wrongBookArea.classList.contains('hidden')) {
                updateWrongBookUI();
            }
        }

        function clearWrongBook() {
            if (!confirm('确定清空所有错题记录吗？')) return;
            wrongBook = [];
            currentWrongIds.clear();
            updateWrongBookUI();
            if (!wrongBookArea.classList.contains('hidden')) {
                wrongBookArea.classList.add('hidden');
            }
            showWrongBtn.style.display = 'none';
        }

        // ========== 重新组卷 ==========
        function resetExam() {
            if (isSubmitted) {
                if (!confirm('重新组卷将清除当前成绩，确定吗？')) return;
            }
            isSubmitted = false;
            currentWrongIds.clear();
            resultArea.classList.add('hidden');
            wrongBookArea.classList.add('hidden');
            document.getElementById('submitExamBtn').style.display = 'inline-block';
            document.getElementById('submitExamBtn2').style.display = 'inline-block';
            if (!fullQuestions) {
                alert('题库未加载，请刷新重试');
                return;
            }
            examQuestions = extractQuestions(fullQuestions);
            renderExam();
            updateProgress();
            showWrongBtn.style.display = 'none';
        }

        // ========== 登录 ==========
        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (user === VALID_USER && pass === VALID_PASS) {
                isLoggedIn = true;
                loginArea.classList.add('hidden');
                examArea.classList.remove('hidden');
                userStatus.textContent = `✅ 已登录: ${user}`;
                logoutBtn.style.display = 'inline-block';
                if (fullQuestions) {
                    examQuestions = extractQuestions(fullQuestions);
                    renderExam();
                } else {
                    statusMsg.textContent = '⏳ 题库加载中，请稍候...';
                    const checkLoaded = setInterval(() => {
                        if (fullQuestions) {
                            clearInterval(checkLoaded);
                            examQuestions = extractQuestions(fullQuestions);
                            renderExam();
                            statusMsg.textContent = '✅ 题库加载完成';
                        }
                    }, 300);
                }
                isSubmitted = false;
                document.getElementById('submitExamBtn').style.display = 'inline-block';
                document.getElementById('submitExamBtn2').style.display = 'inline-block';
                resultArea.classList.add('hidden');
                wrongBookArea.classList.add('hidden');
                showWrongBtn.style.display = 'none';
            } else {
                alert('用户名或密码错误！');
            }
        }

        function logout() {
            if (!confirm('确定退出吗？')) return;
            isLoggedIn = false;
            isSubmitted = false;
            loginArea.classList.remove('hidden');
            examArea.classList.add('hidden');
            resultArea.classList.add('hidden');
            wrongBookArea.classList.add('hidden');
            userStatus.textContent = '未登录';
            logoutBtn.style.display = 'none';
            showWrongBtn.style.display = 'none';
            questionList.innerHTML = '';
            progressInfo.textContent = '已选 0 / 0 题';
        }

        // ========== 加载题库 ==========
        async function loadQuestionBank() {
            try {
                const response = await fetch('十大知识点html.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                fullQuestions = data;

                // 统计并显示
                const ids = Object.keys(data);
                statusMsg.textContent = `✅ 题库加载完成 (${ids.length} 题)`;

                // 先统计再显示
                stats = countQuestions(data);
                updateStatsUI();

                // 预抽取一组题目
                examQuestions = extractQuestions(data);
                renderExam();

                isLoading = false;
            } catch (error) {
                console.error('加载题库失败:', error);
                statusMsg.textContent = '❌ 题库加载失败，请确保 "十大知识点html.json" 文件在同一目录下';
                isLoading = false;
            }
        }

        // ========== 事件绑定 ==========
        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('submitExamBtn').addEventListener('click', submitExam);
        document.getElementById('submitExamBtn2').addEventListener('click', submitExam);
        document.getElementById('resetExamBtn').addEventListener('click', resetExam);
        document.getElementById('showWrongBtn').addEventListener('click', showWrongBook);
        document.getElementById('showWrongFromResultBtn').addEventListener('click', showWrongBook);
        document.getElementById('clearWrongBtn').addEventListener('click', clearWrongBook);
        document.getElementById('backToExamBtn').addEventListener('click', function() {
            resultArea.classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
        document.getElementById('username').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

        // ========== 启动 ==========
        loadQuestionBank();
    </script>
</body>
</html>
