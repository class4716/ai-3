    function parseFull(text) {
        const blocks = text.split(/\n(?=\d+\.\s+)/);
        const qs = [];
        for (let b of blocks) {
            if (!b.trim()) continue;
            const lines = b.split('\n').map(s => s.trim()).filter(s => s);
            let qText = '', options = {}, answer = '', explain = '';
            let qLine = lines[0] || '';
            const qMatch = qLine.match(/^(\d+)\.\s*(.*)/);
            if (qMatch) qText = qMatch[2];
            else qText = qLine;
            let optMode = false;
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if (line.startsWith('A.') || line.startsWith('B.') || line.startsWith('C.') || line.startsWith('D.')) {
                    const match = line.match(/^([ABCD])\.\s*(.*)/);
                    if (match) options[match[1]] = match[2];
                    optMode = true;
                } else if (line.startsWith('答案：') || line.startsWith('答案:')) {
                    const ans = line.replace(/答案[：:]\s*/, '').trim();
                    answer = ans.charAt(0);
                } else if (line.startsWith('解析：') || line.startsWith('解析:')) {
                    explain = line.replace(/解析[：:]\s*/, '').trim();
                } else if (optMode && !line.startsWith('答案') && !line.startsWith('解析')) {
                    const keys = Object.keys(options);
                    if (keys.length > 0) {
                        const last = keys[keys.length-1];
                        options[last] += ' ' + line;
                    }
                }
            }
            if (answer && qText) {
                qs.push({ id: qs.length, text: qText, options, answer, explain });
            }
        }
        return qs;
    }

        if (!q || !activeIds.length) {
            document.getElementById('questionText').innerText = '无题目';
            explainBox.classList.remove('show');
            return;
        }
        document.getElementById('questionText').innerHTML = `${q.text}`;
        document.getElementById('questionCounter').innerText = `第${currentIndex+1}/${activeIds.length}题`;
        let optsHtml = '';
        for (let l of ['A','B','C','D']) {
            const optText = q.options[l] || '';
            optsHtml += `<div class="option" data-letter="${l}">
                <span class="option-letter">${l}</span>
                <span class="option-text">${optText}</span>
            </div>`;
        }
        document.getElementById('optionsContainer').innerHTML = optsHtml;
        if (q.explain) {
            explainText.innerText = q.explain;
            explainBox.classList.add('show');
        } else {
            explainBox.classList.remove('show');
        }
        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', () => {
                let letter = opt.dataset.letter;
                document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
                opt.classList.add('selected');
                selectedOpt = letter;
                const cur = getCur();
                const isCor = (selectedOpt === cur.answer);
                const fb = document.getElementById('feedbackMsg');
                if (isCor) {
                    fb.innerHTML = `<span>✅ 正确！</span>`;
                    fb.className = 'feedback correct';
                } else {
                    fb.innerHTML = `<span>❌ 错误！正确答案是 ${cur.answer}. ${cur.options[cur.answer]}</span>`;
                    fb.className = 'feedback wrong';
                    const realId = activeIds[currentIndex];
                    if (!wrongSet.has(realId)) { wrongSet.add(realId); updateWrongUI(); if(currentMode==='wrong') rebuildActive(); else renderCurrent(); saveAll(); }
                }
                updateRemoveBtn();
            });
        });
        if (adminPanel.style.display === 'block') {
            currentQidSpan.innerText = `#${q.id+1}`;
            currentAnswerSpan.innerText = q.answer;
            adminNewAnswer.value = q.answer;
        }
        updateWrongUI();
        updateRemoveBtn();
        // 更新跳转输入框的占位提示
        jumpInput.placeholder = `1-${questionsBank.length}`;
    }

    function updateWrongUI() {
        const count = wrongSet.size;
        document.getElementById('wrongCountBadge').innerText = count;
        if (!count) { document.getElementById('wrongListContainer').innerHTML = '<li class="empty-wrong">暂无错题</li>'; return; }
        let html = '';
        for (let qid of wrongSet) {
            let qq = questionsBank[qid];
            if (qq) html += `<li data-qid="${qid}"><span>❌ ${qq.text.substring(0,40)}...</span><button class="remove-wrong" data-qid="${qid}">🗑️</button></li>`;
        }
        document.getElementById('wrongListContainer').innerHTML = html;
        document.querySelectorAll('.remove-wrong').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); let qid = parseInt(btn.dataset.qid); wrongSet.delete(qid); updateWrongUI(); if(currentMode==='wrong') rebuildActive(); else renderCurrent(); saveAll(); });
        });
        document.querySelectorAll('#wrongListContainer li').forEach(li => {
            li.addEventListener('click', (e) => {
                if (e.target.classList.contains('remove-wrong')) return;
                let qid = parseInt(li.dataset.qid);
                if (currentMode !== 'all') { currentMode='all'; setActiveModeBtn(); }
                rebuildActive();
                let idx = activeIds.indexOf(qid);
                if (idx !== -1) currentIndex = idx;
                renderCurrent();
                saveAll();
            });
        });
    }

    function updateRemoveBtn() {
        const realId = activeIds[currentIndex];
        if (realId !== undefined && wrongSet.has(realId)) removeCurWrong.innerText = '📌 从错题本移除此题';
        else removeCurWrong.innerText = '⭐ 此题不在错题本';
    }

    function setActiveModeBtn() {
        if (currentMode === 'all') { modeAll.classList.add('active'); modeWrong.classList.remove('active'); }
        else { modeWrong.classList.add('active'); modeAll.classList.remove('active'); }
    }

    function jumpToQuestion() {
        const val = parseInt(jumpInput.value);
        if (isNaN(val) || val < 1 || val > questionsBank.length) {
            alert(`请输入 1 到 ${questionsBank.length} 之间的题号`);
            return;
        }
        const targetId = val - 1; // 原始题库下标
        // 如果当前是错题本模式，且目标题不在错题本中，则自动切换到全部模式
        if (currentMode === 'wrong' && !wrongSet.has(targetId)) {
            currentMode = 'all';
            setActiveModeBtn();
        }
        rebuildActive();
        // 在activeIds中查找目标id
        let idx = activeIds.indexOf(targetId);
        if (idx === -1) {
            // 如果找不到（比如在错题本模式但目标不在），切到全部模式再找
            if (currentMode === 'wrong') {
                currentMode = 'all';
                setActiveModeBtn();
                rebuildActive();
                idx = activeIds.indexOf(targetId);
            }
            if (idx === -1) {
                alert('该题不在当前列表中，请检查题号');
                return;
            }
        }
        currentIndex = idx;
        renderCurrent();
        saveAll();
        jumpInput.value = '';
    }

    function nextQ() { if (activeIds.length && currentIndex+1 < activeIds.length) { currentIndex++; renderCurrent(); saveAll(); } }
    function prevQ() { if (activeIds.length && currentIndex-1 >= 0) { currentIndex--; renderCurrent(); saveAll(); } }
    function clearAllWrong() { if (confirm('清空所有错题？')) { wrongSet.clear(); updateWrongUI(); if(currentMode==='wrong') { currentMode='all'; setActiveModeBtn(); } rebuildActive(); saveAll(); } }
    function removeCurWrongHandler() { let realId = activeIds[currentIndex]; if (wrongSet.has(realId)) { wrongSet.delete(realId); updateWrongUI(); if(currentMode==='wrong') rebuildActive(); else renderCurrent(); saveAll(); } else alert('本题不在错题本'); }

    function adminSaveAnswer() {
        if (!isAdmin) return;
        let q = getCur(); if (!q) return;
        let newAns = adminNewAnswer.value;
        q.answer = newAns;
        let allAnswers = questionsBank.map(qq=>qq.answer);
        localStorage.setItem('custom_answers_new', JSON.stringify(allAnswers));
        renderCurrent();
        alert('答案已修正并永久保存');
    }

    function doLogin() {
        let user = document.getElementById('loginName').value;
        let pwd = document.getElementById('loginPwd').value;
        if(user == 'admin' && pwd == 'admin_123'){
            isAdmin = true;
            userBadgeSpan.innerHTML = '👑 管理员模式 <span class="admin-tag">可纠错</span>';
            adminPanel.style.display = 'block';
			loginDiv.style.display = 'none';
			mainApp.style.display = 'block';
			loadState();
			rebuildActive();
        } else if(user == 'user' && pwd == 'user_123456'){
            isAdmin = false;
            userBadgeSpan.innerHTML = '📖 学员模式';
            adminPanel.style.display = 'none';
			loginDiv.style.display = 'none';
			mainApp.style.display = 'block';
			loadState();
			rebuildActive();
        } else{
			isAdmin = null;
			alert('用户名密码错误，请重试');			
		} 
        jumpInput.placeholder = `1-${questionsBank.length}`;
    }

    function logout() { loginDiv.style.display = 'flex'; mainApp.style.display = 'none'; isAdmin = false; }

    loginBtn.addEventListener('click', doLogin);
    logoutBtn.addEventListener('click', logout);
    modeAll.addEventListener('click', () => { currentMode='all'; setActiveModeBtn(); rebuildActive(); saveAll(); });
    modeWrong.addEventListener('click', () => { currentMode='wrong'; setActiveModeBtn(); rebuildActive(); saveAll(); });
    prev.addEventListener('click', prevQ);
    next.addEventListener('click', nextQ);
    jumpBtn.addEventListener('click', jumpToQuestion);
    jumpInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') jumpToQuestion(); });
    clearWrong.addEventListener('click', clearAllWrong);
    removeCurWrong.addEventListener('click', removeCurWrongHandler);
    if (saveAnswerBtn) saveAnswerBtn.addEventListener('click', adminSaveAnswer);
</script>
</body>
</html>
